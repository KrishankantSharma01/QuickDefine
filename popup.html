<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.85;
    }

    .search-box {
      padding: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #667eea;
    }

    .search-box button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-box button:hover {
      opacity: 0.9;
    }

    #result {
      padding: 0 16px 16px;
      max-height: 320px;
      overflow-y: auto;
    }

    .pos {
      font-size: 12px;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 10px;
      padding-bottom: 3px;
      border-bottom: 2px solid #f0f0f0;
    }

    .def {
      font-size: 13px;
      margin: 5px 0 2px;
      color: #333;
    }

    .def-num {
      font-weight: 600;
      color: #764ba2;
    }

    .example {
      font-style: italic;
      color: #888;
      font-size: 12px;
      margin: 2px 0 6px 14px;
      padding-left: 8px;
      border-left: 2px solid #e6e0f3;
    }

    .word-title {
      font-size: 18px;
      font-weight: 700;
      color: #333;
      text-transform: capitalize;
    }

    .phonetic {
      font-size: 13px;
      color: #888;
      font-style: italic;
    }

    .error {
      text-align: center;
      color: #c0392b;
      padding: 10px 0;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 14px 0;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      padding: 8px;
      font-size: 10px;
      color: #bbb;
      border-top: 1px solid #f0f0f0;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📖 QuickDefine</h1>
    <p>Select any word on a page to see its meaning!</p>
  </div>

  <div class="search-box">
    <input type="text" id="word-input" placeholder="Or type a word here…" autofocus />
    <button id="search-btn">Look Up</button>
  </div>

  <div id="result"></div>

  <div class="footer">
    Powered by <a href="https://dictionaryapi.dev/" target="_blank">Free Dictionary API</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
